name: ALTAMCountdown

options:
  bundleIdPrefix: com.kevinwoods
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    DEVELOPMENT_TEAM: 7YLNYUAHS3
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  ALTAMCountdown:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinwoods.ALTAMCountdown
        PRODUCT_NAME: ALTAM Countdown
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ALTAM Countdown
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Kevin Woods
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/ALTAMCountdown.entitlements
        REGISTER_APP_GROUPS: YES
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: ALTAMCountdownWidgetiOS
        embed: true
        codeSign: true
        destinationFilters: [iOS]
      - target: ALTAMCountdownWidgetmacOS
        embed: true
        codeSign: true
        destinationFilters: [macOS]
    scheme:
      gatherCoverageData: false

  ALTAMCountdownWidgetiOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - Info-macOS.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinwoods.ALTAMCountdown.widget
        PRODUCT_NAME: ALTAMCountdownWidgetiOS
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: ALTAM
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Widget/ALTAMCountdownWidget-iOS.entitlements
        REGISTER_APP_GROUPS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework

  ALTAMCountdownWidgetmacOS:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - Info-macOS.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinwoods.ALTAMCountdown.widget
        PRODUCT_NAME: ALTAMCountdownWidgetmacOS
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info-macOS.plist
        INFOPLIST_KEY_CFBundleDisplayName: ALTAM
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Widget/ALTAMCountdownWidget.entitlements
        REGISTER_APP_GROUPS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
